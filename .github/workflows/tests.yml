name: tests

on:
  push:
    branches:
      - main
      - "feat/**"
      - "eval/**"

  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar tests
        run: python -m pytest -q