[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema"
version = "0.1.0"
description = "Reconocimiento facial con PCA - Sistemas Biométricos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8,<5",  #cambio se ha añadiddo <5
    "pillow>=11.3",   # lee AVIF (hay uno en el dataset con extensión .jpg)
    "cryptography>=41",   # AES-GCM para cifrar los templates de la BD
]

[project.optional-dependencies]
web = ["flask>=2.3"]
dev = ["pytest>=7", "flask>=2.3"]
eval = ["matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]   # "." para que los tests encuentren evaluacion/ también con `pytest` a secas
