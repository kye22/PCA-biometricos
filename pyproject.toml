[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema"
version = "0.1.0"
description = "Reconocimiento facial con PCA - Sistemas Biométricos"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pillow>=11.3",   # lee AVIF (hay uno en el dataset con extensión .jpg)
]

[project.optional-dependencies]
web = ["flask>=2.3"]
dev = ["pytest>=7", "flask>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
